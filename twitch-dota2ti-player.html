<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twitch Dota 2 TI Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1280px; height: 720px; overflow: hidden; background: #000; }
    #player-container { width: 1280px; height: 720px; position: relative; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
    #overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: #0e0e10; flex-direction: column; gap: 16px; z-index: 10;
    }
    #overlay.hidden { display: none; }
    .twitch-logo { color: #9147ff; }
    .status-text { color: #efeff1; font-family: sans-serif; font-size: 18px; opacity: 0.7; }
    .channel-badge {
      background: #9147ff; color: #fff; font-family: sans-serif;
      font-size: 13px; font-weight: 600; padding: 4px 12px;
      border-radius: 20px; letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
<div id="player-container">
  <div id="overlay">
    <div class="twitch-logo">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="currentColor">
        <path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/>
      </svg>
    </div>
    <div class="channel-badge">DOTA 2 TI &#x2022; LIVE</div>
    <div class="status-text">Loading stream...</div>
  </div>
  <iframe id="twitch-iframe" allowfullscreen></iframe>
</div>
<script>
  const hostname = window.location.hostname;
  let parents = [];
  if (hostname === 'localhost' || hostname === '127.0.0.1' || hostname === '') {
    parents = ['localhost'];
  } else {
    parents = [hostname];
  }
  const channel = 'dota2ti';
  const parentParams = parents.map(p => 'parent=' + encodeURIComponent(p)).join('&');
  const iframeSrc = 'https://player.twitch.tv/?channel=' + channel + '&' + parentParams + '&autoplay=true&muted=false';
  const iframe = document.getElementById('twitch-iframe');
  const overlay = document.getElementById('overlay');
  iframe.src = iframeSrc;
  iframe.onload = () => { setTimeout(() => overlay.classList.add('hidden'), 1500); };
  setTimeout(() => overlay.classList.add('hidden'), 5000);
<\/script>
</body>
</html>
